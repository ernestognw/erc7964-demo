[profile.default]
src = "contracts"
script = "script"
test = "contracts/test"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules", "lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"

[rpc_endpoints]
sepolia = "${RPC_SEPOLIA}"
arbitrum_sepolia = "${RPC_ARBITRUM_SEPOLIA}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
